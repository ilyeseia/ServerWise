# Production-style stack: PostgreSQL + one-shot migrations + app.
# Usage:  cp .env.example .env   (set a strong POSTGRES_PASSWORD)  then  docker compose up -d --build
# The database is NOT published to the host; only the app is, and only on localhost
# (put a TLS reverse proxy such as Caddy/Nginx in front for public access).

name: serverwise

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serverwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-serverwise}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build: { context: ., target: migrate }
    restart: "no"
    # Also used for one-off admin commands:
    #   docker compose run --rm migrate pnpm owner:create --email you@example.com --name "Your Name"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-serverwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-serverwise}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  # Raises follow-ups for maintenance visits that are overdue or due soon (idempotent; see
  # docs/CAREOPS.md). Same code and database as the app, no published port.
  worker:
    build: { context: ., target: migrate }
    restart: unless-stopped
    command: ["pnpm", "worker:reminders"]
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-60}
      DATABASE_URL: postgresql://${POSTGRES_USER:-serverwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-serverwise}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Public URL users type in the browser. Must be https:// in production (secure cookies).
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      REQUIRE_OWNER_2FA: ${REQUIRE_OWNER_2FA:-}
      # Optional AI assistant (empty = off). The key lives only in .env, never in the database.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-}
      AI_DAILY_LIMIT_PER_USER: ${AI_DAILY_LIMIT_PER_USER:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-serverwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-serverwise}
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks: [internal]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:

volumes:
  pgdata:
